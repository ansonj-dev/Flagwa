x-backend: &backend
  build: .
  image: flagwa-backend:local
  env_file: .env
  environment:
    DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL using postgres hostname and URL-encoded password}
    REDIS_URL: redis://redis:6379/0
    LOCAL_STORAGE_PATH: /srv/flagwa/storage
    APP_ENV: production
    ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY for network-accessible services}
  volumes:
    - artifacts:/srv/flagwa/storage

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: flagwa
      POSTGRES_USER: flagwa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U flagwa -d flagwa"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 10
  migrate:
    <<: *backend
    command: [sh, -c, "alembic upgrade head && python -m app.cli.seed_locations"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *backend
    ports:
      - 127.0.0.1:${API_PORT:-8000}:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      retries: 3
  worker:
    <<: *backend
    command: [celery, -A, app.workers.celery_app:celery_app, worker, --loglevel=warning, --concurrency=1]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  artifacts: